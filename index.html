    <script>
      // Suppress benign [vite] websocket connection messages in sandboxed container preview
      (function() {
        function shouldSuppress(arg) {
          if (!arg) return false;
          var str = typeof arg === 'string' ? arg : (arg.message || String(arg));
          return str.indexOf('[vite]') !== -1 || str.indexOf('failed to connect to websocket') !== -1;
        }

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) return;
          }
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };

        var origLog = console.log;
        console.log = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) return;
          }
          origLog.apply(console, arguments);
        };

        var origDebug = console.debug;
        console.debug = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) return;
          }
          origDebug.apply(console, arguments);
        };

        // Suppress window error events related to vite websocket
        window.addEventListener('error', function(e) {
          if (shouldSuppress(e.message) || shouldSuppress(e.filename)) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
